<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>전공길잡이 - 대학생 전공 신청 가능 여부 확인</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <h1 class="logo">🎓 전공길잡이</h1>
            <p class="tagline">나에게 맞는 전공을 찾아보세요</p>
        </div>
    </nav>

    <div class="container">
        <!-- 메인 화면 -->
        <div id="mainScreen" class="screen active">
            <div class="hero">
                <h2>복수전공? 부전공? 전과?</h2>
                <p>어떤 전공을 선택할 수 있을지 한눈에 확인하세요</p>
                <button onclick="showScreen('inputScreen')" class="btn btn-primary btn-lg">신청 가능 여부 확인하기</button>
            </div>

            <div class="info-cards">
                <div class="card">
                    <h3>📋 학생 정보 입력</h3>
                    <p>학번, 학과, 학년, 평점, 이수학점을 입력하세요</p>
                </div>
                <div class="card">
                    <h3>✅ 신청 가능 여부 확인</h3>
                    <p>당신이 신청할 수 있는 전공 제도를 확인하세요</p>
                </div>
                <div class="card">
                    <h3>📊 전공 비교</h3>
                    <p>여러 제도의 조건을 한번에 비교하세요</p>
                </div>
            </div>
        </div>

        <!-- 학생 정보 입력 화면 -->
        <div id="inputScreen" class="screen">
            <button onclick="showScreen('mainScreen')" class="btn-back">← 돌아가기</button>
            <h2>학생 정보 입력</h2>
            
            <form id="studentForm" class="form">
                <div class="form-group">
                    <label for="studentId">학번 *</label>
                    <input type="text" id="studentId" placeholder="예: 20210001" required>
                </div>

                <div class="form-group">
                    <label for="department">소속 학과 *</label>
                    <select id="department" required>
                        <option value="">-- 학과 선택 --</option>
                        <option value="cs">컴퓨터공학과</option>
                        <option value="eng">기계공학과</option>
                        <option value="bio">생물학과</option>
                        <option value="econ">경제학과</option>
                        <option value="law">법학과</option>
                        <option value="biz">경영학과</option>
                        <option value="history">한국사학과</option>
                        <option value="psychology">심리학과</option>
                        <option value="german">독어독문학과</option>
                        <option value="french">불어불문학과</option>
                        <option value="english">영어영문학과</option>
                        <option value="chinese">중어중문학과</option>
                        <option value="korean">한문학과</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="grade">현재 학년 *</label>
                    <select id="grade" required>
                        <option value="">-- 학년 선택 --</option>
                        <option value="1">1학년</option>
                        <option value="2">2학년</option>
                        <option value="3">3학년</option>
                        <option value="4">4학년</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="gpa">평균 평점(GPA) * (0.0 ~ 4.5)</label>
                    <input type="number" id="gpa" step="0.1" min="0" max="4.5" placeholder="예: 3.5" required>
                </div>

                <div class="form-group">
                    <label for="credits">현재까지 취득 학점 * (0 ~ 140)</label>
                    <input type="number" id="credits" step="1" min="0" max="140" placeholder="예: 45" required>
                </div>

                <button type="submit" class="btn btn-primary btn-lg">신청 가능 여부 확인</button>
            </form>
        </div>

        <!-- 결과 화면 -->
        <div id="resultScreen" class="screen">
            <button onclick="showScreen('inputScreen')" class="btn-back">← 돌아가기</button>
            <h2>신청 가능 여부</h2>
            
            <div id="resultContainer" class="result-container"></div>

            <div class="button-group">
                <button onclick="showScreen('comparisonScreen')" class="btn btn-secondary">📊 전공 비교하기</button>
                <button onclick="showScreen('inputScreen')" class="btn btn-primary">다시 입력하기</button>
            </div>
        </div>

        <!-- 비교 화면 -->
        <div id="comparisonScreen" class="screen">
            <button onclick="showScreen('resultScreen')" class="btn-back">← 돌아가기</button>
            <h2>전공 제도 비교</h2>
            
            <div id="comparisonTable" class="table-responsive"></div>

            <div class="button-group">
                <button onclick="showScreen('resultScreen')" class="btn btn-primary">결과로 돌아가기</button>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2024 전공길잡이. 대학생을 위한 전공 선택 가이드</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
